[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genius-technician"
version = "2.0.0"
description = "The Master 6-Stone Cognitive Methodology & Diamond Swarm Engine"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
genius = "genius.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
